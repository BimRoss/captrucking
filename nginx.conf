server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # HTML must always revalidate so it can point at the newest assets.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # CSS/JS change every release — revalidate each load (304 when unchanged).
  # We also version their URLs (?v=N) so updates are picked up instantly.
  location ~* \.(?:css|js)$ {
    add_header Cache-Control "no-cache";
  }

  # Media rarely changes — safe to cache. Version the URL if one ever does.
  location ~* \.(?:svg|woff2?|png|jpg|jpeg|webp|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # basic hardening
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
